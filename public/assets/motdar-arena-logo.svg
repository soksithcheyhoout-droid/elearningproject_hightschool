<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="motdarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="50%" stop-color="#2563FF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="goldApex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F5C542" />
    </linearGradient>
    <filter id="motdarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00D9FF" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Hexagonal Shield Frame -->
  <polygon points="50,4 92,26 92,74 50,96 8,74 8,26" stroke="url(#motdarGrad)" stroke-width="2.5" fill="#06101F" filter="url(#motdarGlow)" />
  
  <!-- Inner Concentric Frame -->
  <polygon points="50,11 86,30 86,70 50,89 14,70 14,30" stroke="#00D9FF" stroke-opacity="0.3" stroke-width="1.2" fill="#030712" fill-opacity="0.85" />
  
  <!-- Stylized Geometric "M" Monogram with Center Energy Core -->
  <path d="M26,67 L26,38 L50,56 L74,38 L74,67 L64,67 L64,48 L50,59 L36,48 L36,67 Z" fill="url(#motdarGrad)" />
  
  <!-- Gold Apex Crown Diamond -->
  <polygon points="50,15 57,24 50,33 43,24" fill="url(#goldApex)" />
  
  <!-- Cyberpunk Line Accents -->
  <line x1="20" y1="29" x2="32" y2="29" stroke="#00D9FF" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="68" y1="29" x2="80" y2="29" stroke="#00D9FF" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="50" cy="56" r="2.5" fill="#00D9FF" />
</svg>
