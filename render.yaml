services:
  - type: web
    name: motdar-elearning
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build && cd server && npm install && pip install -r ../python_ai/requirements.txt
    startCommand: node start_production.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
