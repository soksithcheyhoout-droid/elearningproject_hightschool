<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇰🇭</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover" />
    <title>ក្រសួងអភិវឌ្ឍន៍ទេពកោសល្យ និងការស្រាវជ្រាវកម្រិតខ្ពស់ | Ministry of Talent Development & Advanced Research (MoTDAR)</title>
    <meta name="description" content="វេទិកាអប់រំ និងស្រាវជ្រាវឌីជីថលជាតិ ក្រសួងអភិវឌ្ឍន៍ទេពកោសល្យ និងការស្រាវជ្រាវកម្រិតខ្ពស់ - Ministry of Talent Development & Advanced Research E-Learning Platform" />
    
    <!-- Google Fonts: Koulen, Kantumruy Pro, Noto Sans Khmer, Battambang, Outfit, Cinzel with font-display: swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Cinzel:wght@600;700;800&family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&family=Koulen&family=Noto+Sans+Khmer:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Google Identity Services (GSI) SDK for Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <!-- Immediate Anti-Inspect Protection (Runs before bundle loads) -->
    <script>
      (function() {
        var isInput = function(el) {
          if (!el) return false;
          var t = el.tagName ? el.tagName.toUpperCase() : '';
          return t === 'INPUT' || t === 'TEXTAREA' || el.isContentEditable || (el.getAttribute && el.getAttribute('contenteditable') === 'true');
        };

        // 1. Context Menu & Clicks
        window.addEventListener('contextmenu', function(e) {
          if (!isInput(e.target)) { e.preventDefault(); e.stopPropagation(); return false; }
        }, true);
        window.addEventListener('mousedown', function(e) {
          if ((e.button === 2 || e.button === 1 || (e.ctrlKey && e.button === 0)) && !isInput(e.target)) {
            e.preventDefault(); e.stopPropagation(); return false;
          }
        }, true);
        window.addEventListener('auxclick', function(e) {
          if (!isInput(e.target)) { e.preventDefault(); e.stopPropagation(); return false; }
        }, true);
        window.addEventListener('selectstart', function(e) {
          if (!isInput(e.target)) { e.preventDefault(); return false; }
        }, true);
        window.addEventListener('dragstart', function(e) {
          e.preventDefault(); return false;
        }, true);

        // 2. DevTools Shortcuts (Mac & Windows)
        window.addEventListener('keydown', function(e) {
          var k = (e.key || '').toUpperCase();
          var c = e.code || '';
          var code = e.keyCode || 0;

          // F1-F12
          if (/^F([1-9]|1[0-2])$/.test(k) || /^F([1-9]|1[0-2])$/.test(c) || code === 123) {
            e.preventDefault(); e.stopPropagation(); return false;
          }

          // Mac: Cmd + Option + I / J / C / U / K / S / E / R / Z / V
          if (e.metaKey && e.altKey) {
            if (/^[IJCUKSERZV]$/.test(k) || /^Key[IJCUKSERZV]$/.test(c)) {
              e.preventDefault(); e.stopPropagation(); return false;
            }
          }

          // Mac: Cmd + Shift + C / I / J / M / P
          if (e.metaKey && e.shiftKey) {
            if (/^[CIJMP]$/.test(k) || /^Key[CIJMP]$/.test(c)) {
              e.preventDefault(); e.stopPropagation(); return false;
            }
          }

          // Cmd + U / S / P (Mac)
          if (e.metaKey && (k === 'U' || k === 'S' || k === 'P' || c === 'KeyU' || c === 'KeyS' || c === 'KeyP' || code === 85 || code === 83 || code === 80)) {
            e.preventDefault(); e.stopPropagation(); return false;
          }

          // Cmd + A outside inputs (Mac)
          if (e.metaKey && (k === 'A' || c === 'KeyA' || code === 65) && !isInput(e.target)) {
            e.preventDefault(); e.stopPropagation(); return false;
          }

          // Windows: Ctrl + Shift + I / J / C / K / S / E / M / P
          if (e.ctrlKey && e.shiftKey) {
            if (/^[IJCKS EMP]$/.test(k) || /^Key[IJCKS EMP]$/.test(c) || code === 73 || code === 74 || code === 67) {
              e.preventDefault(); e.stopPropagation(); return false;
            }
          }

          // Windows: Ctrl + U / S / P
          if (e.ctrlKey && (k === 'U' || k === 'S' || k === 'P' || c === 'KeyU' || c === 'KeyS' || c === 'KeyP' || code === 85 || code === 83 || code === 80)) {
            e.preventDefault(); e.stopPropagation(); return false;
          }

          // Windows: Ctrl + A outside inputs
          if (e.ctrlKey && (k === 'A' || c === 'KeyA' || code === 65) && !isInput(e.target)) {
            e.preventDefault(); e.stopPropagation(); return false;
          }
        }, true);

        // 3. Early DevTools Freeze Trap
        setInterval(function() {
          try {
            (function() { return false; }['constructor']('debugger')['call']());
          } catch(e) {}
        }, 250);
      })();
    </script>
  </head>
  <body oncontextmenu="return false;" onselectstart="return false;" ondragstart="return false;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
